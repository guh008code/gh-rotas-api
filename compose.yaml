# Ambiente local com SQL Server Developer e dados persistentes.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Execute scripts/setup-docker.ps1}"
    ports:
      - "127.0.0.1:${SQL_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: "${MSSQL_SA_PASSWORD:?Execute scripts/setup-docker.ps1}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?Execute scripts/setup-docker.ps1}"
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/docker-init.sh"]
    restart: "no"

  api:
    image: gh-rotas-api:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: "SqlServer"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=GhRotas;User ID=gh_rotas;Password=${APP_DB_PASSWORD:?Execute scripts/setup-docker.ps1};Encrypt=true;TrustServerCertificate=true"
      Jwt__Key: "${Jwt__Key:?Execute scripts/setup-docker.ps1}"
      Cors__AllowedOrigins__0: "${CORS_ORIGIN:-http://localhost:3000}"
    restart: unless-stopped

volumes:
  sqlserver-data:
